<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Halbach-Array – Draufsicht und verstärkte Feldseite</title>
<desc id="desc">Lineares Halbach-Array aus acht Magnetblöcken mit jeweils um 90 Grad rotierter Magnetisierung. Oberhalb verstärktes Magnetfeld, unterhalb abgeschwächtes. Kreuze zeigen Magnetisierung in die Ebene, Kreise mit Punkt aus der Ebene.</desc>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1765a5"/></marker>
 <marker id="magarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23272e"/></marker>
</defs>
<rect width="1100" height="650" fill="white"/>
<text x="550" y="44" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#202d3a">Lineares Halbach-Array – Draufsicht</text>
<text x="550" y="80" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#505967">Magnetisierungsvektoren drehen sich von Block zu Block um 90°</text>
<!-- reinforcement arrows, top side -->
<text x="550" y="121" font-family="sans-serif" font-size="20" font-weight="700" fill="#1765a5" text-anchor="middle">Verstärkte Feldseite</text>
<g stroke="#1765a5" fill="none" stroke-width="3.4" marker-end="url(#arr)" opacity="0.9">
<path d="M135 262 Q225 145 315 262"/><path d="M315 262 Q405 145 495 262"/><path d="M495 262 Q585 145 675 262"/><path d="M675 262 Q765 145 855 262"/><path d="M855 262 Q935 155 1020 262"/>
<path d="M155 254 Q225 188 295 254"/><path d="M335 254 Q405 188 475 254"/><path d="M515 254 Q585 188 655 254"/><path d="M695 254 Q765 188 835 254"/>
</g>
<!-- blocks -->
<g font-family="sans-serif" text-anchor="middle" font-size="19" fill="#263746">
<rect x="70" y="270" width="120" height="125" fill="#e8f0f7" stroke="#293746" stroke-width="2"/>
<rect x="190" y="270" width="120" height="125" fill="#dae9f3" stroke="#293746" stroke-width="2"/>
<rect x="310" y="270" width="120" height="125" fill="#e8f0f7" stroke="#293746" stroke-width="2"/>
<rect x="430" y="270" width="120" height="125" fill="#dae9f3" stroke="#293746" stroke-width="2"/>
<rect x="550" y="270" width="120" height="125" fill="#e8f0f7" stroke="#293746" stroke-width="2"/>
<rect x="670" y="270" width="120" height="125" fill="#dae9f3" stroke="#293746" stroke-width="2"/>
<rect x="790" y="270" width="120" height="125" fill="#e8f0f7" stroke="#293746" stroke-width="2"/>
<rect x="910" y="270" width="120" height="125" fill="#dae9f3" stroke="#293746" stroke-width="2"/>
</g>
<!-- Perpendicular mag symbols and horizontal vectors -->
<g stroke="#222b35" stroke-width="5" stroke-linecap="round">
<circle cx="130" cy="332" r="25" fill="none"/><circle cx="130" cy="332" r="6" fill="#222b35" stroke="none"/>
<line x1="345" y1="307" x2="395" y2="357"/><line x1="395" y1="307" x2="345" y2="357"/>
<circle cx="610" cy="332" r="25" fill="none"/><circle cx="610" cy="332" r="6" fill="#222b35" stroke="none"/>
<line x1="825" y1="307" x2="875" y2="357"/><line x1="875" y1="307" x2="825" y2="357"/>
</g>
<g stroke="#222b35" stroke-width="5" marker-end="url(#magarr)">
<line x1="286" y1="332" x2="215" y2="332"/>
<line x1="455" y1="332" x2="526" y2="332"/>
<line x1="766" y1="332" x2="695" y2="332"/>
<line x1="935" y1="332" x2="1006" y2="332"/>
</g>
<text x="550" y="436" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#68737c">Abgeschwächte Feldseite (idealisiert: nahezu kompensiert)</text>
<line x1="100" y1="465" x2="1000" y2="465" stroke="#d8dee3" stroke-dasharray="6,7"/>
<g font-family="sans-serif" font-size="17" fill="#263746">
<text x="85" y="512">⊙  = Magnetisierung aus der Zeichenebene (Nordseite zeigt zum Betrachter)</text>
<text x="85" y="545">×  = Magnetisierung in die Zeichenebene (Südseite zeigt zum Betrachter)</text>
<text x="85" y="578">→ / ←  = Magnetisierung innerhalb der Zeichenebene</text>
</g>
<text x="550" y="619" font-family="sans-serif" font-size="15" fill="#68737c" text-anchor="middle">Schematisch, nicht maßstabsgetreu · Rand- und Streufelder nicht dargestellt</text>
</svg>
